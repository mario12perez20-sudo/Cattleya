<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" fill="none">
  <g transform="translate(150,165)" stroke="#9B3060" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sépalos (3) — más angostos -->
    <path stroke-width="1.4" stroke-opacity="0.18"
          d="M0,0 C-11,-14 -13,-52 0,-72 C13,-52 11,-14 0,0"/>
    <path stroke-width="1.4" stroke-opacity="0.18"
          d="M0,0 C-11,-14 -13,-52 0,-72 C13,-52 11,-14 0,0"
          transform="rotate(120)"/>
    <path stroke-width="1.4" stroke-opacity="0.18"
          d="M0,0 C-11,-14 -13,-52 0,-72 C13,-52 11,-14 0,0"
          transform="rotate(240)"/>
    <!-- Pétalos (2) — más anchos y redondos -->
    <path stroke-width="1.6" stroke-opacity="0.18"
          d="M0,0 C-22,-10 -27,-46 0,-66 C27,-46 22,-10 0,0"
          transform="rotate(60)"/>
    <path stroke-width="1.6" stroke-opacity="0.18"
          d="M0,0 C-22,-10 -27,-46 0,-66 C27,-46 22,-10 0,0"
          transform="rotate(300)"/>
    <!-- Labelo (labellum) — el pétalo inferior característico -->
    <path stroke-width="1.4" stroke-opacity="0.18"
          d="M-18,5 C-24,24 -20,54 0,76 C20,54 24,24 18,5 C10,14 -10,14 -18,5"/>
    <!-- Columna central -->
    <ellipse cx="0" cy="-4" rx="6" ry="8" stroke-width="1.1" stroke-opacity="0.14"/>
  </g>
</svg>
